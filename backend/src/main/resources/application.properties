spring.application.name=email-mvp-backend

# En local usa 8080; en Render, Render inyecta la variable PORT.
server.port=${PORT:8080}

# URL del Cloudflare Worker.
#   - Local (wrangler dev): http://localhost:8787
#   - Producción: https://email-mvp-worker.<tu-subdominio>.workers.dev
app.worker.url=${WORKER_URL:http://localhost:8787}

# Secreto compartido con el Worker. Debe coincidir con WORKER_SHARED_SECRET del Worker.
# En producción se define como variable de entorno, nunca en el repositorio.
app.worker.shared-secret=${WORKER_SHARED_SECRET:cambia_este_secreto_por_uno_largo_y_aleatorio}

# Tiempos de espera hacia el Worker.
app.worker.connect-timeout-ms=5000
app.worker.read-timeout-ms=15000

# Orígenes permitidos para CORS (frontend de Vite). Separa varios con comas.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
